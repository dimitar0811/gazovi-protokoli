<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подписване на газов протокол</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#1c2733;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:900px;margin:20px auto;padding:12px}.sheet{background:#fff;padding:24px;border-radius:12px;box-shadow:0 3px 18px #142a4018}h1{font-size:24px;text-align:center;margin:0 0 6px;color:#183d5c}#subtitle{text-align:center;color:#536779;margin:0 0 20px}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:20px}.field{border:1px solid #d5dee7;border-radius:8px;padding:10px;overflow-wrap:anywhere}.field b{display:block;font-size:12px;color:#5a6b7b;text-transform:uppercase;margin-bottom:3px}.section{border:1px solid #cbd6e1;border-radius:9px;margin:14px 0;overflow:hidden}.section h2{font-size:16px;background:#f1f5f8;margin:0;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;padding:10px}.value{padding:7px 9px;background:#fafbfd;border-radius:6px;overflow-wrap:anywhere}.value b{display:block;font-size:12px;color:#5a6b7b}.notes{white-space:pre-wrap;padding:12px;overflow-wrap:anywhere}.signatures{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}.sig{border:1px solid #d5dee7;border-radius:8px;padding:12px;min-height:100px}.sig img{display:block;max-width:100%;max-height:90px;object-fit:contain;margin-top:8px}#status{padding:14px;background:#fff;border-radius:10px;margin-bottom:12px;white-space:pre-wrap}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}button{background:#183d5c;color:#fff;border:0;border-radius:8px;padding:11px 16px;font:inherit;cursor:pointer;font-weight:600}button.secondary{background:#e4ebf1;color:#183d5c}button:disabled{opacity:.55}#signPanel{background:#fff;border-radius:10px;padding:18px;margin:14px 0;box-shadow:0 3px 18px #142a4018}label{display:block;font-weight:600;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #bac7d4;border-radius:8px;font:inherit}canvas{width:100%;height:150px;border:2px dashed #8b9daf;border-radius:8px;background:#fff;touch-action:none;display:block}small{color:#526171}@media print{body{background:white}.sheet{box-shadow:none;padding:0;border-radius:0}main{margin:0;padding:0;max-width:none}#status,#signPanel,#actions{display:none!important}.section,.field,.sig{break-inside:avoid}h1{font-size:20px}}
</style></head><body><main>
<div id="status">Зареждане на протокола…</div>
<article id="sheet" class="sheet" hidden><h1>Газов протокол</h1><p id="subtitle">Протокол за газови измервания — копие за клиента</p><div id="meta" class="meta"></div>
<div class="section"><h2>Данни за клиента и обекта</h2><div id="client" class="grid"></div></div>
<div class="section"><h2>Коректор</h2><div id="corrector" class="grid"></div></div>
<div class="section"><h2>Разходомер</h2><div id="meter" class="grid"></div></div>
<div class="section"><h2>Допълнителна информация</h2><div id="extra" class="grid"></div><div id="notes" class="notes"></div></div>
<div class="signatures"><div class="sig"><b>Председател на доставчика</b><div id="techName"></div><div id="techSig"></div></div><div class="sig"><b>Клиент / представител</b><div id="clientNameView"></div><div id="clientSig"></div></div></div></article>
<section id="signPanel" hidden><h2>Подпис на клиента</h2><label for="clientName">Име и фамилия</label><input id="clientName" autocomplete="name" maxlength="120" placeholder="Въведете името си"><label for="signature">Подпис с пръст или мишка</label><canvas id="signature" width="1200" height="380"></canvas><div class="actions"><button class="secondary" id="clearBtn" type="button">Изчисти подписа</button><button id="submitBtn" type="button">Потвърди подписа</button></div></section>
<div class="actions" id="actions" hidden><button id="printBtn" type="button">Принтирай / Запази като PDF</button></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://dryzqeychhxquhmieeuu.supabase.co','sb_publishable_HkUsXQ95F1m1UuBdjfvDJA_mXqTTMBl'),$=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token');let signed=false,loaded=false,drawing=false,ink=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function field(l,v){return '<div class="field"><b>'+esc(l)+'</b>'+esc(v??'—')+'</div>'}function value(l,v){return '<div class="value"><b>'+esc(l)+'</b>'+esc(v??'—')+'</div>'}function status(t,ok=false){$('status').textContent=t;$('status').style.background=ok?'#e7f6ec':'#fff'}
function showSig(id,v){const m=String(v||'').match(/data:image\/(?:png|jpeg);base64,[A-Za-z0-9+/=]+/);if(m){const im=document.createElement('img');im.src=m[0];im.alt='Подпис';$(id).replaceChildren(im)}}
function render(d){const p=d?.protocol||{};$('meta').innerHTML=field('Номер на протокола',p.pno)+field('Дата',p.date)+field('Клиент',p.client)+field('ЕИК',p.eik);$('client').innerHTML=value('Клиент / фирма',p.client)+value('ЕИК',p.eik)+value('Обект',p.site)+value('Адрес / контакт',p.contact)+value('Председател на доставчика',p.tech_name||p.tech);$('corrector').innerHTML=value('Модел',p.cbm)+value('Сериен номер',p.cs)+value('Дата на проверка',p.cd)+value('Начално показание',p.c1)+value('Крайно показание',p.c2)+value('Количество',p.cv);$('meter').innerHTML=value('Модел',p.mbm)+value('Сериен номер',p.ms)+value('Дата на проверка',p.md)+value('Начално показание',p.m1)+value('Крайно показание',p.m2)+value('Количество',p.mv);$('extra').innerHTML=value('Номер',p.pno)+value('Дата',p.date);$('notes').textContent=p.notes?'Забележки: '+p.notes:'Няма допълнителни забележки.';$('techName').textContent=p.tech_name||p.tech||'—';$('clientNameView').textContent=d.client_name||p.client_name||'—';showSig('techSig',p.tech_sig);showSig('clientSig',d.client_signature||p.client_sig);$('sheet').hidden=false;$('actions').hidden=false}
async function init(){if(!token){status('Липсва защитеният линк. Отворете пълния линк, изпратен от приложението.');return}try{const {data,error}=await sb.rpc('get_protocol_for_signing',{p_token:token});if(error)throw error;signed=!!data.signed;loaded=true;render(data);if(signed){$('signPanel').hidden=true;status('Протоколът вече е подписан. Можете да го принтирате или да го запазите като PDF.',true)}else{$('signPanel').hidden=false;status('Проверете протокола и подпишете, ако данните са правилни.',true)}}catch(e){console.error(e);status(e.message||'Не успяхме да заредим протокола. Проверете линка и опитайте отново.')}}
const c=$('signature'),ctx=c.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#152536';function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.addEventListener('pointerdown',e=>{if(!loaded||signed)return;drawing=true;ink=true;c.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()});c.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()});function stop(){drawing=false}c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);
$('clearBtn').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);ink=false};$('submitBtn').onclick=async()=>{if(!loaded||signed)return;const name=$('clientName').value.trim();if(name.length<2){status('Моля, въведете името си.');return}if(!ink){status('Моля, поставете подпис в полето.');return}$('submitBtn').disabled=true;status('Записване на подписа…');try{const sig=c.toDataURL('image/png'),{error}=await sb.rpc('submit_protocol_signature',{p_token:token,p_client_name:name,p_client_signature:sig});if(error)throw error;signed=true;$('clientNameView').textContent=name;showSig('clientSig',sig);$('signPanel').hidden=true;status('Подписът е записан успешно. Можете да принтирате или да запазите целия протокол като PDF.',true)}catch(e){console.error(e);status(e.message||'Не успяхме да запишем подписа. Опитайте отново.');$('submitBtn').disabled=false}};$('printBtn').onclick=()=>window.print();init();
</script></body></html>
