<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Газов протокол за фактуриране</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#1c2733;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:900px;margin:20px auto;padding:12px}.sheet{background:#fff;padding:24px;border-radius:12px;box-shadow:0 3px 18px #142a4018}h1{font-size:24px;text-align:center;margin:0 0 6px;color:#183d5c}#subtitle{text-align:center;color:#536779;margin:0 0 20px}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:20px}.field{border:1px solid #d5dee7;border-radius:8px;padding:10px;overflow-wrap:anywhere}.field b{display:block;font-size:12px;color:#5a6b7b;text-transform:uppercase;margin-bottom:3px}.section{border:1px solid #cbd6e1;border-radius:9px;margin:14px 0;overflow:hidden}.section h2{font-size:16px;background:#f1f5f8;margin:0;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;padding:10px}.value{padding:7px 9px;background:#fafbfd;border-radius:6px;overflow-wrap:anywhere}.value b{display:block;font-size:12px;color:#5a6b7b}.notes{white-space:pre-wrap;padding:12px;overflow-wrap:anywhere}.signatures{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}.sig{border:1px solid #d5dee7;border-radius:8px;padding:12px;min-height:100px}.sig img{display:block;max-width:100%;max-height:90px;object-fit:contain;margin-top:8px}.actions{text-align:center;margin:14px 0}.actions button{background:#183d5c;color:#fff;border:0;border-radius:8px;padding:11px 16px;font:inherit;cursor:pointer}#status{padding:14px;background:#fff;border-radius:10px;margin-bottom:12px;white-space:pre-wrap}small{color:#526171}@media print{body{background:white}.sheet{box-shadow:none;padding:0;border-radius:0}main{margin:0;padding:0;max-width:none}.actions{display:none}.section,.field,.sig{break-inside:avoid}h1{font-size:20px}}
</style>
</head>
<body><main>
<div id="status">Зареждане на протокола…</div>
<article id="sheet" class="sheet" hidden>
<h1>Газов протокол</h1><p id="subtitle">Копие за проверка и фактуриране — само за преглед</p>
<div id="meta" class="meta"></div>
<div class="section"><h2>Данни за клиента и обекта</h2><div id="client" class="grid"></div></div>
<div class="section"><h2>Коректор</h2><div id="corrector" class="grid"></div></div>
<div class="section"><h2>Разходомер</h2><div id="meter" class="grid"></div></div>
<div class="section"><h2>Допълнителна информация</h2><div id="extra" class="grid"></div><div id="notes" class="notes"></div></div>
<div class="signatures"><div class="sig"><b>Техник</b><div id="techName"></div><div id="techSig"></div></div><div class="sig"><b>Клиент / представител</b><div id="clientName"></div><div id="clientSig"></div></div></div>
</article>
<div class="actions" id="actions" hidden><button type="button" onclick="window.print()">Печат / Запази като PDF</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://dryzqeychhxquhmieeuu.supabase.co';
const SUPABASE_KEY='sb_publishable_HkUsXQ95F1m1UuBdjfvDJA_mXqTTMBl';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function field(label,value){return '<div class="field"><b>'+esc(label)+'</b>'+esc(value||'—')+'</div>'}
function value(label,v){return '<div class="value"><b>'+esc(label)+'</b>'+esc(v||'—')+'</div>'}
function signature(el,v){
 const s=String(v||''),m=s.match(/data:image\/png;base64,([A-Za-z0-9+/=]+)/);
 if(m)$(el).innerHTML='<img alt="Подпис" src="data:image/png;base64,'+m[1]+'">';
}
async function init(){
 const token=new URLSearchParams(location.search).get('token');
 if(!token){$('status').textContent='Липсва защитеният линк. Отворете пълния линк, изпратен от приложението.';return}
 try{
  const {data,error}=await sb.rpc('get_protocol_for_accounting',{p_token:token});
  if(error)throw error;
  const p=data?.protocol||{};
  $('meta').innerHTML=field('Номер на протокола',p.pno)+field('Дата',p.date)+field('Клиент',p.client)+field('ЕИК',p.eik);
  $('client').innerHTML=value('Клиент / фирма',p.client)+value('ЕИК',p.eik)+value('Обект',p.site)+value('Адрес / контакт',p.contact)+value('Техник',p.tech_name||p.tech);
  $('corrector').innerHTML=value('Модел',p.cbm)+value('Сериен номер',p.cs)+value('Дата на проверка',p.cd)+value('Начално показание',p.c1)+value('Крайно показание',p.c2)+value('Количество',p.cv);
  $('meter').innerHTML=value('Модел',p.mbm)+value('Сериен номер',p.ms)+value('Дата на проверка',p.md)+value('Начално показание',p.m1)+value('Крайно показание',p.m2)+value('Количество',p.mv);
  $('extra').innerHTML=value('Номер',p.pno)+value('Дата',p.date);
  $('notes').textContent=p.notes?'Забележки: '+p.notes:'Няма допълнителни забележки.';
  $('techName').textContent=p.tech_name||p.tech||'—';
  $('clientName').textContent=p.client_name||'—';
  signature('techSig',p.tech_sig);signature('clientSig',p.client_sig);
  $('sheet').hidden=false;$('actions').hidden=false;$('status').textContent='Протоколът е зареден в режим само за преглед. Линкът е валиден 90 дни.';
 }catch(e){console.error(e);$('status').textContent='Не успяхме да заредим протокола. Линкът може да е невалиден или изтекъл. '+(e?.message||'')}
}
init();
</script></body></html>
