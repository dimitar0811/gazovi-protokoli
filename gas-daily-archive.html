<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Архив — Дневен протокол АГРС База Чепеларе</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Arial,sans-serif;color:#17212b;background:#f3f5f7}body{margin:0;padding:14px;max-width:850px;margin:auto}h1{font-size:21px}button{background:#145da0;color:#fff;border:0;border-radius:7px;padding:10px 13px;font-size:15px;cursor:pointer}.secondary{background:#4d5965}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.archive-item{background:#fff;padding:12px;border:1px solid #ccd3d9;border-radius:8px;margin:9px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.archive-meta{flex:1;overflow-wrap:anywhere}.archive-actions{display:flex;flex-wrap:wrap;gap:7px}.month-folder{background:#fff;border:1px solid #cbd5df;border-radius:8px;margin:10px 0;padding:10px}.month-folder summary{cursor:pointer;font-weight:700;padding:5px}.month-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.month-tools input{font:inherit;padding:9px;border:1px solid #bac8d5;border-radius:7px}.month-count{color:#58636d;font-weight:400}.danger{background:#b42318}.status{font-size:14px;color:#a33}.muted{color:#58636d;font-size:14px}@media(max-width:520px){.archive-item{display:block}.archive-actions{margin-top:10px}}
</style></head><body>
<div class="actions"><button class="secondary" onclick="location.href='gas-daily.html?v=20261030delete1'">← Назад към дневния протокол</button></div>
<h1>Архив на дневните протоколи — АГРС База Чепеларе</h1>
<p class="muted">Протоколите се подреждат автоматично по месеци. Можете да добавите и празна папка за месец, в който все още няма протоколи.</p>
<div class="month-tools"><label for="newMonth">Месец:</label><input id="newMonth" type="month"><button type="button" onclick="addMonthFolder()">＋ Добави папка</button></div>
<div id="status" class="status" aria-live="polite"></div><div id="archiveList">Зареждане на архива…</div>
<script>
const SUPABASE_URL='https://dryzqeychhxquhmieeuu.supabase.co';
const SUPABASE_KEY='sb_publishable_HkUsXQ95F1m1UuBdjfvDJA_mXqTTMBl';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function status(s){$('status').textContent=s}
async function user(){const {data,error}=await sb.auth.getUser();if(error||!data.user)throw new Error('Първо влезте в основното приложение със своя профил.')}
const MONTHS=['Януари','Февруари','Март','Април','Май','Юни','Юли','Август','Септември','Октомври','Ноември','Декември'];
const FOLDER_STORAGE_KEY='gasDailyArchiveMonthFolders_v1';
function monthKey(date){const s=String(date||'');let m=s.match(/^(\d{4})-(\d{2})/);if(m)return m[1]+'-'+m[2];m=s.match(/^(\d{2})\\.(\d{2})\\.(\d{4})/);if(m)return m[3]+'-'+m[2];return 'без-дата'}
function monthLabel(key){if(key==='без-дата')return 'Без дата';const [y,m]=key.split('-').map(Number);return (MONTHS[m-1]||'Месец')+' '+y}
function savedFolders(){try{const v=JSON.parse(localStorage.getItem(FOLDER_STORAGE_KEY)||'[]');return Array.isArray(v)?v.filter(x=>/^\d{4}-(0[1-9]|1[0-2])$/.test(x)):[]}catch{return []}}
function addMonthFolder(){const input=$('newMonth'),key=input.value;if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(key)){status('Изберете месец и година.');return}try{const folders=savedFolders();if(folders.includes(key)){status('Папката '+monthLabel(key)+' вече съществува.');return}folders.push(key);localStorage.setItem(FOLDER_STORAGE_KEY,JSON.stringify(folders));input.value='';status('Добавена е папка: '+monthLabel(key)+'.');loadArchive()}catch(e){status('Папката не може да бъде запазена в този браузър: '+(e.message||e))}}
async function loadArchive(){try{await user();const {data,error}=await sb.from('gas_daily_protocols').select('id,protocol_date,protocol_time,checker_name,consumption').order('protocol_date',{ascending:false}).order('protocol_time',{ascending:false}).limit(100);if(error)throw error;const grouped={};(data||[]).forEach(d=>{const key=monthKey(d.protocol_date);(grouped[key]||(grouped[key]=[])).push(d)});const keys=[...new Set([...Object.keys(grouped),...savedFolders()])].sort((a,b)=>b.localeCompare(a));const list=$('archiveList');list.innerHTML='';if(!keys.length){list.textContent='Няма записани протоколи. Можете да добавите папка за месец от полето по-горе.';return}keys.forEach(key=>{const records=grouped[key]||[];const folder=document.createElement('details');folder.className='month-folder';const summary=document.createElement('summary');summary.textContent=monthLabel(key)+' ';const count=document.createElement('span');count.className='month-count';count.textContent='('+records.length+' протокола)';summary.appendChild(count);folder.appendChild(summary);records.forEach(d=>{const div=document.createElement('div');div.className='archive-item';const meta=document.createElement('div');meta.className='archive-meta';const strong=document.createElement('strong');strong.textContent=d.protocol_date+' '+(d.protocol_time||'');const details=document.createElement('div');details.textContent=(d.checker_name||'Без име')+' — разход: '+(d.consumption??'—');meta.append(strong,details);const controls=document.createElement('div');controls.className='archive-actions';const open=document.createElement('button');open.textContent='Отвори';open.onclick=()=>location.href='gas-daily.html?v=20261030delete1&record='+encodeURIComponent(d.id);const pdf=document.createElement('button');pdf.textContent='PDF';pdf.className='secondary';pdf.title='Отвори протокола за запазване като PDF';pdf.onclick=()=>location.href='gas-daily.html?v=20261030delete1&record='+encodeURIComponent(d.id)+'&pdf=1';const del=document.createElement('button');del.textContent='Изтрий';del.className='danger';del.onclick=()=>deleteRecord(d.id,d.protocol_date);controls.append(open,pdf,del);div.append(meta,controls);folder.appendChild(div)});if(!records.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='Няма протоколи в тази папка.';folder.appendChild(empty)}list.appendChild(folder)})}catch(e){status('Архивът не се отвори: '+(e.message||e)+' Проверете дали сте влезли в основното приложение.');$('archiveList').textContent=''}}
async function deleteRecord(id,date){if(!confirm('Сигурни ли сте, че искате да изтриете дневния протокол от '+date+'? Това действие не може да бъде отменено.'))return;try{await user();const {error}=await sb.from('gas_daily_protocols').delete().eq('id',id);if(error)throw error;status('Протоколът е изтрит от дневния архив.');await loadArchive()}catch(e){status('Неуспешно изтриване: '+(e.message||e))}}
loadArchive();
</script></body></html>
