<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{font-family:Arial,sans-serif;color:#17212b;background:#f3f5f7}body{margin:0;padding:14px;max-width:850px;margin:auto;font-size:16px}h1{font-size:23px;text-align:center;line-height:1.35}h2{font-size:19px}label{display:block;font-weight:700;font-size:16px;margin:9px 0 5px}input,select{font:17px Arial;padding:10px;border:1px solid #aab4be;border-radius:6px;width:100%;box-sizing:border-box;background:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.sheet{background:white;padding:18px;border:1px solid #d5dbe0;border-radius:10px}.tablewrap{overflow-x:auto;width:82%;max-width:620px;margin:0 auto}table{border-collapse:collapse;width:100%;min-width:0;table-layout:fixed;font-size:16px}th,td{border:1px solid #66717a;padding:7px 4px;text-align:center;line-height:1.45;overflow-wrap:anywhere}th{background:#eaf0f5;font-size:15px}td input{border:0;padding:8px 2px;min-width:0;width:100%;text-align:center;font-size:16px;line-height:1.4}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.actions button{background:#145da0;color:white;border:0;border-radius:7px;padding:11px 13px;font-size:15px}.actions .secondary{background:#4d5965}.small{font-size:13px;color:#58636d}.archive-item{background:white;padding:10px;border:1px solid #ccd3d9;border-radius:7px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.archive-item button{padding:8px}.signature{border:1px solid #777;border-radius:5px;touch-action:none;width:100%;height:110px;background:white}.signature-actions{display:flex;gap:8px;margin-top:5px}.signature-actions button{padding:7px}.consumption{font-weight:bold;font-size:16px}.status{font-size:14px;margin:8px 0;color:#a33}.hidden{display:none}.sheet.a4-export{box-sizing:border-box;width:794px;height:auto;min-height:1123px;padding:28px 34px;border:0;border-radius:0;margin:0;background:#fff;font-size:13px;overflow:visible}.a4-export h1{font-size:19px;line-height:1.35;margin:8px 0 16px}.a4-export h2{font-size:16px;margin:12px 0 7px}.a4-export label{font-size:12px;margin:5px 0 4px}.a4-export .grid{gap:7px}.a4-export input{font-size:12px;padding:5px;border-radius:2px}.a4-export table{min-width:0;width:82%;margin:0 auto 0 0;table-layout:fixed;font-size:13px}.a4-export th:first-child,.a4-export td:first-child{width:9%;font-size:10px;padding-left:1px;padding-right:1px}.a4-export th:nth-child(2),.a4-export td:nth-child(2){width:29%}.a4-export th:nth-child(3),.a4-export td:nth-child(3){width:34%}.a4-export th:nth-child(4),.a4-export td:nth-child(4){width:28%}.a4-export th,.a4-export td{padding:6px 4px;height:auto;min-height:36px;line-height:1.6;vertical-align:middle;overflow-wrap:anywhere}.a4-export td input{display:block;width:100%;height:30px;min-height:30px;min-width:0;box-sizing:border-box;padding:4px 2px;font-size:14px;line-height:22px;vertical-align:middle}.a4-export .signature{height:85px}.a4-export .small{font-size:10px}.a4-export .no-print{display:none!important}@media(max-width:520px){.grid{grid-template-columns:1fr}.sheet{padding:12px}}
</style></head><body>
<div class="actions no-print"><button type="button" onclick="location.href='index.html'">← Към основното приложение</button></div>
<section class="sheet" id="capture">
<h1>ПРОТОКОЛ ЗА НАЛИЧИЕ НА ПРИРОДЕН ГАЗ В КОНТЕЙНЕРИТЕ,<br>НАМИРАЩИ СЕ В АГРС / БАЗА ЧЕПЕЛАРЕ</h1>
<div class="grid">
<div><label for="pdate">Дата</label><input id="pdate" type="date"></div>
<div><label for="ptime">Час</label><input id="ptime" type="time"></div>
<div><label for="temp">Температура</label><input id="temp" placeholder="напр. 12 °C"></div>
<div><label for="previous">Предишно показание на коректора</label><input id="previous" inputmode="decimal" placeholder="Показание"></div>
<div><label for="corrector">Текущо показание на коректора</label><input id="corrector" inputmode="decimal" placeholder="Показание"></div>
<div><label for="mechanical">Показание на механичния брояч</label><input id="mechanical" inputmode="decimal" placeholder="Показание"></div>
</div>
<p>Разход по коректора: <span class="consumption" id="consumption">—</span> куб. м</p>
<h2>Показания на модулите</h2>
<div class="tablewrap"><table><thead><tr><th>Модул</th><th>Номер</th><th>Налягане</th><th>Мер. един.</th></tr></thead><tbody id="modules"></tbody></table></div>
<div class="grid" style="margin-top:12px"><div><label for="checker">Име и фамилия на проверилия</label><input id="checker" placeholder="Име и фамилия"></div></div>
<h2>Подпис на проверилия</h2><canvas class="signature" id="signature" aria-label="Поле за подпис"></canvas>
<div class="signature-actions no-print"><button type="button" class="secondary" onclick="clearSignature()">Изчисти подписа</button></div>
<p class="small">Протоколът е съставен за дневна проверка на АГРС / База Чепеларе.</p>
</section>
<div class="actions no-print">
<button onclick="saveProtocol()">Запиши в архива</button><button onclick="newProtocol()" class="secondary">Нов протокол</button><button onclick="shareImage()">Снимка / Viber</button><button onclick="location.href='gas-daily-archive.html?v=20261022'" class="secondary">Отвори архива</button>
</div><p id="status" class="status"></p>
<section id="archive" class="hidden"><h2>Архив на дневните протоколи</h2><div id="archiveList"></div></section>
<script>
const SUPABASE_URL='https://dryzqeychhxquhmieeuu.supabase.co';
const SUPABASE_KEY='sb_publishable_HkUsXQ95F1m1UuBdjfvDJA_mXqTTMBl';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let editingId=null,hasInk=false;
function status(s){$('status').textContent=s}
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
$('pdate').value=localDate();$('ptime').value=new Date().toTimeString().slice(0,5);
for(let i=1;i<=10;i++){const tr=document.createElement('tr');tr.innerHTML='<td>'+i+'</td><td><input aria-label="Номер модул '+i+'" data-field="number"></td><td><input aria-label="Налягане модул '+i+'" data-field="pressure" inputmode="decimal"></td><td><input aria-label="Мерна единица модул '+i+'" data-field="unit" value="bar"></td>';$('modules').appendChild(tr)}
function calc(){const a=parseFloat($('corrector').value.replace(',','.')),b=parseFloat($('previous').value.replace(',','.'));$('consumption').textContent=Number.isFinite(a)&&Number.isFinite(b)?(a-b).toLocaleString('bg-BG',{maximumFractionDigits:3}):'—'}
$('corrector').addEventListener('input',calc);$('previous').addEventListener('input',calc);
const canvas=$('signature'),ctx=canvas.getContext('2d');function resizeCanvas(){const old=hasInk?canvas.toDataURL():null;const r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(r.width*devicePixelRatio));canvas.height=Math.floor(130*devicePixelRatio);ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#111';if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,130);im.src=old}}resizeCanvas();
let drawing=false;function point(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}canvas.addEventListener('pointerdown',e=>{drawing=true;hasInk=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(...p)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineTo(...point(e));ctx.stroke()});['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,()=>drawing=false));
function clearSignature(){ctx.clearRect(0,0,canvas.width,canvas.height);hasInk=false}
function formData(){const corrector=parseFloat($('corrector').value.replace(',','.')),previous=parseFloat($('previous').value.replace(',','.'));return {protocol_date:$('pdate').value,protocol_time:$('ptime').value||null,temperature:$('temp').value,corrector_reading:Number.isFinite(corrector)?corrector:null,mechanical_reading:parseNum($('mechanical').value),previous_corrector_reading:Number.isFinite(previous)?previous:null,consumption:Number.isFinite(corrector)&&Number.isFinite(previous)?corrector-previous:null,modules:[...$('modules').querySelectorAll('tr')].map((tr,i)=>({module:i+1,number:tr.querySelector('[data-field=number]').value,pressure:tr.querySelector('[data-field=pressure]').value,unit:tr.querySelector('[data-field=unit]').value})),checker_name:$('checker').value,signature_data:hasInk?canvas.toDataURL('image/png'):''}}
function parseNum(v){const n=parseFloat(v.replace(',','.'));return Number.isFinite(n)?n:null}
async function user(){const {data,error}=await sb.auth.getUser();if(error||!data.user){throw new Error('Първо влезте в основното приложение със своя профил.')}return data.user}
async function saveProtocol(){try{const u=await user(),d=formData();if(!d.protocol_date)throw Error('Въведете дата.');if(!d.checker_name.trim())throw Error('Въведете име и фамилия на проверилия.');const row={...d,user_id:u.id,updated_at:new Date().toISOString()};let q;if(editingId)q=await sb.from('gas_daily_protocols').update(row).eq('id',editingId).select().single();else q=await sb.from('gas_daily_protocols').insert(row).select().single();if(q.error)throw q.error;editingId=q.data.id;status('Протоколът е записан в отделния архив.')}catch(e){status('Неуспешен запис: '+(e.message||e)+' Ако таблицата още не е създадена, изпълнете SQL файла от docs в Supabase SQL Editor.')}}
async function loadArchive(){try{await user();const {data,error}=await sb.from('gas_daily_protocols').select('id,protocol_date,protocol_time,checker_name,consumption').order('protocol_date',{ascending:false}).order('protocol_time',{ascending:false}).limit(100);if(error)throw error;$('archive').classList.remove('hidden');$('archiveList').innerHTML='';if(!data.length)$('archiveList').textContent='Няма записани дневни протоколи.';data.forEach(d=>{const div=document.createElement('div');div.className='archive-item';const label=document.createElement('span');label.textContent=d.protocol_date+' '+(d.protocol_time||'')+' — '+d.checker_name+' — разход: '+(d.consumption??'—');const controls=document.createElement('div');controls.style.display='flex';controls.style.gap='6px';const b=document.createElement('button');b.textContent='Отвори';b.onclick=()=>openRecord(d.id);const del=document.createElement('button');del.textContent='Изтрий';del.style.background='#b42318';del.onclick=()=>deleteRecord(d.id,d.protocol_date);controls.append(b,del);div.append(label,controls);$('archiveList').appendChild(div)})}catch(e){status('Архивът не се отвори: '+(e.message||e)+' Проверете дали SQL настройката е изпълнена.')}}
async function deleteRecord(id,date){if(!confirm('Сигурни ли сте, че искате да изтриете дневния протокол от '+date+'? Това действие не може да бъде отменено.'))return;try{await user();const {error}=await sb.from('gas_daily_protocols').delete().eq('id',id);if(error)throw error;if(editingId===id){editingId=null;status('Протоколът е изтрит от дневния архив.');}else status('Протоколът е изтрит от дневния архив.');await loadArchive()}catch(e){status('Неуспешно изтриване: '+(e.message||e))}}
async function openRecord(id){try{const {data,error}=await sb.from('gas_daily_protocols').select('*').eq('id',id).single();if(error)throw error;editingId=id;const d=data;$('pdate').value=d.protocol_date;$('ptime').value=d.protocol_time||'';$('temp').value=d.temperature||'';$('corrector').value=d.corrector_reading??'';$('mechanical').value=d.mechanical_reading??'';$('previous').value=d.previous_corrector_reading??'';$('checker').value=d.checker_name||'';[...$('modules').querySelectorAll('tr')].forEach((tr,i)=>{const m=(d.modules||[])[i]||{};tr.querySelector('[data-field=number]').value=m.number||'';tr.querySelector('[data-field=pressure]').value=m.pressure||'';tr.querySelector('[data-field=unit]').value=m.unit||''});clearSignature();if(d.signature_data&&String(d.signature_data).trim()){await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{try{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);hasInk=true;resolve()}catch(e){reject(e)}};im.onerror=()=>reject(new Error('Подписът е записан, но изображението не може да се зареди.'));im.src=String(d.signature_data).trim()})}calc();window.scrollTo({top:0,behavior:'smooth'});status(d.signature_data&&String(d.signature_data).trim()?'Протоколът и подписът са заредени от архива.':'Протоколът е отворен, но този запис няма запазени данни за подпис.')}catch(e){status('Грешка при отваряне на протокола: '+(e.message||String(e)))}}
function newProtocol(){if(!confirm('Започвате нов дневен протокол? Записаният протокол остава в архива.'))return;editingId=null;$('pdate').value=localDate();$('ptime').value=new Date().toTimeString().slice(0,5);['temp','mechanical','previous','corrector','checker'].forEach(id=>$(id).value='');[...$('modules').querySelectorAll('tr')].forEach(tr=>tr.querySelectorAll('input').forEach((el,i)=>el.value=i===2?'bar':''));clearSignature();calc();status('Нов протокол.')}
async function shareImage(){const sheet=$('capture');const swapped=[];try{status('Подготвя се снимка във формат А4…');sheet.classList.add('a4-export');const exportTable=sheet.querySelector('table');if(exportTable){exportTable.style.setProperty('width','82%','important');exportTable.style.setProperty('margin-left','0','important');exportTable.style.setProperty('margin-right','auto','important');exportTable.style.setProperty('table-layout','fixed','important');const colWidths=['9%','29%','34%','28%'];exportTable.querySelectorAll('tr').forEach(tr=>tr.querySelectorAll('th,td').forEach((cell,i)=>{cell.style.setProperty('width',colWidths[i]||'','important');cell.style.setProperty('max-width',colWidths[i]||'','important');if(i===0){cell.style.setProperty('padding-left','1px','important');cell.style.setProperty('padding-right','1px','important');cell.style.setProperty('font-size','10px','important')}}))}await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));sheet.querySelectorAll('input').forEach(input=>{const span=document.createElement('span');const cs=getComputedStyle(input);span.textContent=input.value||' ';span.style.display='flex';span.style.alignItems='center';span.style.justifyContent=cs.textAlign==='center'?'center':'flex-start';span.style.boxSizing='border-box';span.style.width='100%';span.style.maxWidth=input.closest('td')?'100%':'100%';span.style.minWidth='0';span.style.minHeight=input.closest('td')?'32px':(cs.height==='auto'?'32px':cs.height);span.style.height='auto';span.style.padding=input.closest('td')?'4px 2px':'6px';span.style.fontFamily='Arial,sans-serif';span.style.fontSize=input.closest('td')?'14px':cs.fontSize;span.style.fontWeight=cs.fontWeight;span.style.lineHeight='22px';span.style.color='#17212b';span.style.whiteSpace='pre-wrap';span.style.overflow='visible';span.style.overflowWrap='anywhere';span.style.border='0';span.style.background='transparent';input.replaceWith(span);swapped.push({input,span})});const captureHeight=Math.ceil(sheet.scrollHeight);const source=await html2canvas(sheet,{scale:2,backgroundColor:'#ffffff',useCORS:true,width:794,height:captureHeight,windowWidth:850,scrollX:0,scrollY:0});const c=document.createElement('canvas');c.width=1588;c.height=Math.max(2246,Math.round(1588*captureHeight/794));const out=c.getContext('2d');out.fillStyle='#ffffff';out.fillRect(0,0,c.width,c.height);const fit=Math.min(c.width/source.width,c.height/source.height);const drawW=Math.round(source.width*fit),drawH=Math.round(source.height*fit);out.drawImage(source,0,0,source.width,source.height,0,0,drawW,drawH);const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)throw Error('Снимката не можа да се създаде.');const file=new File([blob],'dneven-protokol-AGRS-A4.png',{type:'image/png'});swapped.reverse().forEach(({input,span})=>span.replaceWith(input));swapped.length=0;sheet.classList.remove('a4-export');if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Дневен протокол АГРС — База Чепеларе',text:'Дневен протокол във формат А4'});status('Отворено е менюто за споделяне. Изберете Viber.')}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('Снимката във формат А4 е изтеглена. Отворете я и я изпратете във Viber.')}}catch(e){swapped.reverse().forEach(({input,span})=>{if(span.parentNode)span.replaceWith(input)});sheet.classList.remove('a4-export');if(e.name!=='AbortError')status('Грешка при създаване/споделяне на снимката: '+(e.message||e))}}
// При отваряне от отделната архивна страница зареждаме избрания протокол.
const requestedRecord=new URLSearchParams(location.search).get('record');
if(requestedRecord){openRecord(requestedRecord)}
</script></body></html>
