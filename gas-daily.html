<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дневен протокол — АГРС База Чепеларе</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{font-family:Arial,sans-serif;color:#17212b;background:#f3f5f7}body{margin:0;padding:14px;max-width:850px;margin:auto}h1{font-size:21px;text-align:center}h2{font-size:17px}label{display:block;font-weight:700;font-size:14px;margin:8px 0 4px}input,select{font:16px Arial;padding:9px;border:1px solid #aab4be;border-radius:6px;width:100%;box-sizing:border-box;background:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.sheet{background:white;padding:18px;border:1px solid #d5dbe0;border-radius:10px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:400px}th,td{border:1px solid #66717a;padding:5px;text-align:center}th{background:#eaf0f5}td input{border:0;padding:7px;min-width:55px;text-align:center}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.actions button{background:#145da0;color:white;border:0;border-radius:7px;padding:11px 13px;font-size:15px}.actions .secondary{background:#4d5965}.small{font-size:13px;color:#58636d}.archive-item{background:white;padding:10px;border:1px solid #ccd3d9;border-radius:7px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.archive-item button{padding:8px}.signature{border:1px solid #777;border-radius:5px;touch-action:none;width:100%;height:130px;background:white}.signature-actions{display:flex;gap:8px;margin-top:5px}.signature-actions button{padding:7px}.consumption{font-weight:bold;font-size:18px}.status{font-size:14px;margin:8px 0;color:#a33}.hidden{display:none}@media(max-width:520px){.grid{grid-template-columns:1fr}.sheet{padding:12px}}
</style></head><body>
<div class="actions no-print"><button type="button" onclick="location.href='index.html'">← Към основното приложение</button></div>
<section class="sheet" id="capture">
<h1>ПРОТОКОЛ ЗА НАЛИЧИЕ НА ПРИРОДЕН ГАЗ В КОНТЕЙНЕРИТЕ,<br>НАМИРАЩИ СЕ В АГРС / БАЗА ЧЕПЕЛАРЕ</h1>
<div class="grid">
<div><label for="pdate">Дата</label><input id="pdate" type="date"></div>
<div><label for="ptime">Час</label><input id="ptime" type="time"></div>
<div><label for="temp">Температура</label><input id="temp" placeholder="напр. 12 °C"></div>
<div><label for="mechanical">Показание на механичния брояч</label><input id="mechanical" inputmode="decimal" placeholder="Показание"></div>
<div><label for="previous">Предишно показание на коректора</label><input id="previous" inputmode="decimal" placeholder="Показание"></div>
<div><label for="corrector">Текущо показание на коректора</label><input id="corrector" inputmode="decimal" placeholder="Показание"></div>
</div>
<p>Разход по коректора: <span class="consumption" id="consumption">—</span> куб. м</p>
<h2>Показания на модулите</h2>
<div class="tablewrap"><table><thead><tr><th>Модул</th><th>Номер</th><th>Налягане</th><th>Мер. един.</th></tr></thead><tbody id="modules"></tbody></table></div>
<div class="grid" style="margin-top:12px"><div><label for="checker">Име и фамилия на проверилия</label><input id="checker" placeholder="Име и фамилия"></div></div>
<h2>Подпис на проверилия</h2><canvas class="signature" id="signature" aria-label="Поле за подпис"></canvas>
<div class="signature-actions no-print"><button type="button" class="secondary" onclick="clearSignature()">Изчисти подписа</button></div>
<p class="small">Протоколът е съставен за дневна проверка на АГРС / База Чепеларе.</p>
</section>
<div class="actions no-print">
<button onclick="saveProtocol()">Запиши в архива</button><button onclick="newProtocol()" class="secondary">Нов протокол</button><button onclick="shareImage()">Снимка / Viber</button><button onclick="loadArchive()" class="secondary">Отвори архива</button>
</div><p id="status" class="status"></p>
<section id="archive" class="hidden"><h2>Архив на дневните протоколи</h2><div id="archiveList"></div></section>
<script>
const SUPABASE_URL='https://dryzqeychhxquhmieeuu.supabase.co';
const SUPABASE_KEY='sb_publishable_HkUsXQ95F1m1UuBdjfvDJA_mXqTTMBl';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let editingId=null,hasInk=false;
function status(s){$('status').textContent=s}
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
$('pdate').value=localDate();$('ptime').value=new Date().toTimeString().slice(0,5);
for(let i=1;i<=10;i++){const tr=document.createElement('tr');tr.innerHTML='<td>'+i+'</td><td><input aria-label="Номер модул '+i+'" data-field="number"></td><td><input aria-label="Налягане модул '+i+'" data-field="pressure" inputmode="decimal"></td><td><input aria-label="Мерна единица модул '+i+'" data-field="unit" value="bar"></td>';$('modules').appendChild(tr)}
function calc(){const a=parseFloat($('corrector').value.replace(',','.')),b=parseFloat($('previous').value.replace(',','.'));$('consumption').textContent=Number.isFinite(a)&&Number.isFinite(b)?(a-b).toLocaleString('bg-BG',{maximumFractionDigits:3}):'—'}
$('corrector').addEventListener('input',calc);$('previous').addEventListener('input',calc);
const canvas=$('signature'),ctx=canvas.getContext('2d');function resizeCanvas(){const old=hasInk?canvas.toDataURL():null;const r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(r.width*devicePixelRatio));canvas.height=Math.floor(130*devicePixelRatio);ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#111';if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,130);im.src=old}}resizeCanvas();
let drawing=false;function point(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}canvas.addEventListener('pointerdown',e=>{drawing=true;hasInk=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(...p)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineTo(...point(e));ctx.stroke()});['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,()=>drawing=false));
function clearSignature(){ctx.clearRect(0,0,canvas.width,canvas.height);hasInk=false}
function formData(){const corrector=parseFloat($('corrector').value.replace(',','.')),previous=parseFloat($('previous').value.replace(',','.'));return {protocol_date:$('pdate').value,protocol_time:$('ptime').value||null,temperature:$('temp').value,corrector_reading:Number.isFinite(corrector)?corrector:null,mechanical_reading:parseNum($('mechanical').value),previous_corrector_reading:Number.isFinite(previous)?previous:null,consumption:Number.isFinite(corrector)&&Number.isFinite(previous)?corrector-previous:null,modules:[...$('modules').querySelectorAll('tr')].map((tr,i)=>({module:i+1,number:tr.querySelector('[data-field=number]').value,pressure:tr.querySelector('[data-field=pressure]').value,unit:tr.querySelector('[data-field=unit]').value})),checker_name:$('checker').value,signature_data:hasInk?canvas.toDataURL('image/png'):''}}
function parseNum(v){const n=parseFloat(v.replace(',','.'));return Number.isFinite(n)?n:null}
async function user(){const {data,error}=await sb.auth.getUser();if(error||!data.user){throw new Error('Първо влезте в основното приложение със своя профил.')}return data.user}
async function saveProtocol(){try{const u=await user(),d=formData();if(!d.protocol_date)throw Error('Въведете дата.');if(!d.checker_name.trim())throw Error('Въведете име и фамилия на проверилия.');const row={...d,user_id:u.id,updated_at:new Date().toISOString()};let q;if(editingId)q=await sb.from('gas_daily_protocols').update(row).eq('id',editingId).select().single();else q=await sb.from('gas_daily_protocols').insert(row).select().single();if(q.error)throw q.error;editingId=q.data.id;status('Протоколът е записан в отделния архив.')}catch(e){status('Неуспешен запис: '+(e.message||e)+' Ако таблицата още не е създадена, изпълнете SQL файла от docs в Supabase SQL Editor.')}}
async function loadArchive(){try{await user();const {data,error}=await sb.from('gas_daily_protocols').select('id,protocol_date,protocol_time,checker_name,consumption').order('protocol_date',{ascending:false}).order('protocol_time',{ascending:false}).limit(100);if(error)throw error;$('archive').classList.remove('hidden');$('archiveList').innerHTML='';if(!data.length)$('archiveList').textContent='Няма записани дневни протоколи.';data.forEach(d=>{const div=document.createElement('div');div.className='archive-item';const label=document.createElement('span');label.textContent=d.protocol_date+' '+(d.protocol_time||'')+' — '+d.checker_name+' — разход: '+(d.consumption??'—');const b=document.createElement('button');b.textContent='Отвори';b.onclick=()=>openRecord(d.id);div.append(label,b);$('archiveList').appendChild(div)})}catch(e){status('Архивът не се отвори: '+(e.message||e)+' Проверете дали SQL настройката е изпълнена.')}}
async function openRecord(id){try{const {data,error}=await sb.from('gas_daily_protocols').select('*').eq('id',id).single();if(error)throw error;editingId=id;const d=data;$('pdate').value=d.protocol_date;$('ptime').value=d.protocol_time||'';$('temp').value=d.temperature||'';$('corrector').value=d.corrector_reading??'';$('mechanical').value=d.mechanical_reading??'';$('previous').value=d.previous_corrector_reading??'';$('checker').value=d.checker_name||'';[...$('modules').querySelectorAll('tr')].forEach((tr,i)=>{const m=(d.modules||[])[i]||{};tr.querySelector('[data-field=number]').value=m.number||'';tr.querySelector('[data-field=pressure]').value=m.pressure||'';tr.querySelector('[data-field=unit]').value=m.unit||''});clearSignature();if(d.signature_data){const im=new Image();im.onload=()=>{ctx.drawImage(im,0,0,canvas.width,canvas.height);hasInk=true};im.src=d.signature_data}calc();window.scrollTo({top:0,behavior:'smooth'});status('Отворен запис от архива.')}catch(e){status(e.message||String(e))}}
function newProtocol(){if(!confirm('Започвате нов дневен протокол? Записаният протокол остава в архива.'))return;editingId=null;$('pdate').value=localDate();$('ptime').value=new Date().toTimeString().slice(0,5);['temp','mechanical','previous','corrector','checker'].forEach(id=>$(id).value='');[...$('modules').querySelectorAll('tr')].forEach(tr=>tr.querySelectorAll('input').forEach((el,i)=>el.value=i===2?'bar':''));clearSignature();calc();status('Нов протокол.')}
async function shareImage(){try{status('Подготвя се снимката…');const c=await html2canvas($('capture'),{scale:2,backgroundColor:'#ffffff',useCORS:true});const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)throw Error('Снимката не можа да се създаде.');const file=new File([blob],'dneven-protokol-AGRS.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Дневен протокол АГРС — База Чепеларе',text:'Дневен протокол за наличие на природен газ'});status('Отворено е менюто за споделяне. Изберете Viber.')}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();URL.revokeObjectURL(url);status('Снимката е изтеглена. Отворете я и я изпратете във Viber.')}}catch(e){if(e.name!=='AbortError')status('Грешка при създаване/споделяне на снимката: '+(e.message||e))}}
</script></body></html>
